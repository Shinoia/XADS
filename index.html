<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XADS</title>
<style>
  :root{
    --bg:#f5f6fb; --card:#ffffff; --ink:#1b1d2a; --muted:#7a7f95; --line:#eceef5; --field:#f6f7fc;
    --accent:#5b5bd6; --accent-2:#7b6cf6; --accent-soft:#eef0ff;
    --ok:#16a34a; --ok-soft:#effcf3; --ok-line:#c9f0d6;
    --danger:#d92d20; --danger-soft:#fff1f0; --radius:18px;
    --shadow:0 1px 2px rgba(27,29,42,.04), 0 10px 30px rgba(27,29,42,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);min-height:100vh;
    font:15.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    background:
      radial-gradient(900px 420px at 10% -10%, #e9e8ff 0%, transparent 60%),
      radial-gradient(800px 380px at 100% 0%, #e6f6ff 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed}
  [hidden]{display:none!important}
  button{font-family:inherit}

  /* ---------- barra do topo ---------- */
  .top{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:14px 20px;background:rgba(255,255,255,.72);backdrop-filter:saturate(1.6) blur(14px);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(27,29,42,.06)}
  .brand{grid-column:2;font-weight:800;font-size:22px;letter-spacing:.32em;padding-left:.32em;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .op{grid-column:3;justify-self:end;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  .op b{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);color:var(--ink);
    padding:4px 12px 4px 4px;border-radius:999px;font-weight:600;box-shadow:0 1px 2px rgba(27,29,42,.05)}
  .op b::before{content:attr(data-ini);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:12px;text-transform:uppercase}
  .link{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px}
  .link:hover{background:var(--accent-soft);color:var(--accent)}
  @media (max-width:560px){ .op span{display:none} .op{gap:4px} .op b{font-size:0;padding:2px;gap:0} .op b::before{font-size:12px} .brand{font-size:19px} .top{padding:12px 14px} }

  /* ---------- base ---------- */
  main{max-width:760px;margin:0 auto;padding:26px 16px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);
    animation:sobe .35s ease both}
  @keyframes sobe{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:23px;margin:0 0 4px;letter-spacing:-.2px}
  h2{font-size:12px;margin:0 0 14px;color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  p.sub{margin:0 0 22px;color:var(--muted)}
  #telaEntrada{max-width:420px;margin:7vh auto 0}

  label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#3d4152}
  label .req{color:var(--accent)}
  input{width:100%;padding:13px 14px;border:1px solid transparent;border-radius:12px;font:inherit;
    background:var(--field);color:var(--ink);transition:background .15s,border-color .15s,box-shadow .15s}
  input::placeholder{color:#a6abbd}
  input:hover{background:#f1f2f9}
  input:focus{outline:0;background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px rgba(91,91,214,.12)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid .full{grid-column:1/-1}
  @media (max-width:560px){.grid{grid-template-columns:1fr} .card{padding:20px}}
  fieldset{border:0;padding:0;margin:0 0 26px}
  fieldset + fieldset{padding-top:22px;border-top:1px dashed var(--line)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1em}
  .hint.ok{color:var(--ok)} .hint.err{color:var(--danger)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
    padding:14px 20px;font-weight:600;font-size:15px;line-height:1;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px rgba(91,91,214,.28);
    transition:transform .12s,box-shadow .12s,filter .12s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(91,91,214,.32)}
  .btn:active{transform:none}
  .btn:disabled{opacity:.6;cursor:wait;transform:none}
  .btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--accent-soft);box-shadow:none}
  .btn.block{width:100%}

  /* ---------- abas ---------- */
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.7);border:1px solid var(--line);padding:5px;border-radius:14px;
    margin-bottom:18px;box-shadow:0 1px 2px rgba(27,29,42,.04)}
  .tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:10px;font-weight:600;font-size:14.5px;
    color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(27,29,42,.08)}
  .badge{display:inline-block;min-width:22px;padding:1px 8px;margin-left:6px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700}

  .preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:12px;
    background:linear-gradient(135deg,#f3f2ff,#eef7ff);font-size:13.5px;color:var(--muted);margin-bottom:24px}
  .preview code{font:600 14.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent)}

  .msg{padding:12px 14px;border-radius:12px;margin-top:14px;font-size:14px}
  .msg.err{background:var(--danger-soft);color:var(--danger)}

  /* ---------- cadastro feito ---------- */
  .ok-box{border-color:var(--ok-line);background:linear-gradient(180deg,var(--ok-soft),#fff 70%)}
  .ok-box h1{color:var(--ok);display:flex;align-items:center;gap:10px}
  .kv{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;margin:20px 0 22px;
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kv dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .kv dd{margin:0;font:600 15.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
  .copy{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s,color .15s}
  .copy:hover{background:var(--accent-soft);border-color:#d9dcff;color:var(--accent)}
  .row-btns{display:flex;gap:10px;flex-wrap:wrap}

  /* ---------- meus cadastros ---------- */
  .toolbar{display:flex;gap:10px;margin-bottom:12px}
  .toolbar input{flex:1;background:#fff;border-color:var(--line)}
  .status{color:var(--muted);font-size:13.5px;margin:4px 4px 14px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;
    box-shadow:0 1px 2px rgba(27,29,42,.04);transition:box-shadow .15s,transform .15s;animation:sobe .3s ease both}
  .item:hover{box-shadow:var(--shadow)}
  .item summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
  .item summary::-webkit-details-marker{display:none}
  .item .who{flex:1;min-width:0}
  .item .who b{display:block;font-size:15.5px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .who span{display:block;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);word-break:break-all;margin-top:2px}
  .item .mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .item .mini em{font-style:normal;font-size:13px;word-break:break-all;background:var(--field);border-radius:9px;padding:5px 10px}
  .item .mini small{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .item .when{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
  .item[open]{box-shadow:var(--shadow)}
  .item[open] summary{border-bottom:1px solid var(--line)}
  .det{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px 18px;padding:16px 18px;background:#fbfbfe}
  .det div small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .det div{font-size:14px;word-break:break-word}
  .det .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--muted);padding:48px 10px;background:rgba(255,255,255,.6);border:1px dashed var(--line);border-radius:16px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
    box-shadow:0 8px 24px rgba(27,29,42,.2)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">XADS</div>
  <div class="op" id="opBox" hidden>
    <span>Operador</span><b id="opNome"></b>
    <button class="link" id="btnSair" type="button">sair</button>
  </div>
</header>

<main>
  <!-- ENTRADA DO OPERADOR -->
  <section id="telaEntrada" class="card">
    <h1>Entrar</h1>
    <p class="sub">Use o usuário e a senha de operador. Os cadastros que você fizer ficam ligados ao seu usuário.</p>
    <form id="formEntrada" novalidate>
      <div class="grid">
        <div class="full">
          <label for="inOperador">Usuário <span class="req">*</span></label>
          <input id="inOperador" autocomplete="username" autocapitalize="off" required>
        </div>
        <div class="full">
          <label for="inCodigo">Senha <span class="req">*</span></label>
          <input id="inCodigo" type="password" autocomplete="current-password" required>
        </div>
      </div>
      <div style="margin-top:18px"><button class="btn block" id="btnEntrar">Entrar</button></div>
      <div class="msg err" id="erroEntrada" hidden></div>
    </form>
  </section>

  <!-- APP -->
  <section id="telaApp" hidden>
    <nav class="tabs">
      <button type="button" class="on" data-aba="novo">Novo cadastro</button>
      <button type="button" data-aba="lista">Meus cadastros<span class="badge" id="contador">0</span></button>
    </nav>

    <!-- NOVO CADASTRO -->
    <section id="abaNovo">
      <div id="resultado" class="card ok-box" hidden>
        <h1>✓ Cadastro feito</h1>
        <p class="sub" id="resPessoa"></p>
        <dl class="kv">
          <dt>E-mail</dt><dd id="resEmail"></dd><button class="copy" data-copiar="resEmail">Copiar</button>
          <dt>Senha</dt><dd id="resSenha"></dd><button class="copy" data-copiar="resSenha">Copiar</button>
          <dt>Pix</dt><dd id="resPix"></dd><button class="copy" data-copiar="resPix">Copiar</button>
        </dl>
        <div class="row-btns">
          <button class="btn" id="btnOutro" type="button">Cadastrar outra pessoa</button>
          <button class="btn ghost" id="btnVerLista" type="button">Ver meus cadastros</button>
        </div>
      </div>

      <form id="formCadastro" class="card" novalidate>
        <div class="preview">Prévia do ID: <code id="prevId">—</code></div>

        <fieldset>
          <h2>Empresa e usuário</h2>
          <div class="grid">
            <div>
              <label for="f_empresa">Empresa <span class="req">*</span></label>
              <input id="f_empresa" name="empresa" required>
            </div>
            <div>
              <label for="f_pessoa">Nome do usuário <span class="req">*</span></label>
              <input id="f_pessoa" name="pessoa" required>
            </div>
            <div class="full">
              <label for="f_imei">IMEI ou SR</label>
              <input id="f_imei" name="imei" autocapitalize="characters">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <h2>Documento e banco</h2>
          <div class="grid">
            <div>
              <label for="f_cpf">CPF</label>
              <input id="f_cpf" name="cpf" inputmode="numeric" placeholder="Só números">
              <div class="hint" id="hintCpf"></div>
            </div>
            <div>
              <label for="f_banco">Banco</label>
              <input id="f_banco" name="banco">
            </div>
            <div>
              <label for="f_agencia">Agência</label>
              <input id="f_agencia" name="agencia" inputmode="numeric">
            </div>
            <div>
              <label for="f_conta">Conta (CC)</label>
              <input id="f_conta" name="conta">
            </div>
            <div class="full">
              <label for="f_pix">PIX</label>
              <input id="f_pix" name="pix" autocapitalize="off">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <h2>Endereço</h2>
          <div class="grid">
            <div>
              <label for="f_cep">CEP</label>
              <input id="f_cep" name="cep" inputmode="numeric" placeholder="Só números">
              <div class="hint" id="hintCep"></div>
            </div>
            <div>
              <label for="f_numero">Número (N-C)</label>
              <input id="f_numero" name="numero" inputmode="numeric">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <h2>Valor</h2>
          <div class="grid">
            <div>
              <label for="f_valor">$</label>
              <input id="f_valor" name="valor" inputmode="decimal">
            </div>
          </div>
        </fieldset>

        <button class="btn block" id="btnCadastrar">Cadastrar</button>
        <div class="msg err" id="erroCadastro" hidden></div>
      </form>
    </section>

    <!-- MEUS CADASTROS -->
    <section id="abaLista" hidden>
      <div class="toolbar">
        <input id="busca" placeholder="Buscar por nome, e-mail, empresa, CPF, IMEI ou Pix">
        <button class="btn ghost" id="btnAtualizar" type="button">Atualizar</button>
      </div>
      <div class="status" id="statusLista"></div>
      <div id="lista"></div>
    </section>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO: cole aqui a URL do App da Web do Apps Script
   (termina em /exec)
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbycPUwwOVIei1wrujomiRZVco3q3WWOko03-lLiGy_TkdeFGcEtIhUVC-yCi-z0OquzWw/exec";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const limpar = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}
async function copiar(texto){
  try{ await navigator.clipboard.writeText(texto); toast("Copiado"); }
  catch(e){ toast("Não foi possível copiar"); }
}
function mostrarErro(el, msg){ el.textContent = msg; el.hidden = !msg; }

/* ---------- comunicação com a planilha ---------- */
function apiPronta(){
  return API_URL && API_URL.startsWith("https://");
}
// todos os pedidos vão por POST (a senha não aparece na URL)
async function api(acao, extra){
  // sem cabeçalhos: o navegador envia como texto simples e o Apps Script aceita
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 40000); // desiste depois de 40 s
  let r, texto;
  try{
    r = await fetch(API_URL, {
      method:"POST",
      body: JSON.stringify(Object.assign({ acao, usuario:sessao.usuario, senha:sessao.senha }, extra || {})),
      signal: ctrl.signal
    });
    texto = await r.text();
  }catch(e){
    if(e.name === "AbortError") throw new Error("A planilha demorou demais para responder (mais de 40 s). Tente de novo.");
    throw new Error("Sem conexão com a planilha. Confira a internet e se o App da Web está publicado para \"Qualquer pessoa\".");
  }finally{
    clearTimeout(timer);
  }
  let j;
  try{ j = JSON.parse(texto); }
  catch(e){ throw new Error("A planilha respondeu algo inesperado (HTTP " + r.status + "). Confira se o App da Web foi publicado com o código novo."); }
  if(!j.ok){
    // usuário removido da aba Operadores ou senha trocada: volta para o login
    if(/usu[aá]rio ou senha/i.test(j.erro || "") && !$("#telaApp").hidden) sair("Seu acesso mudou. Entre de novo.");
    throw new Error(j.erro || "Erro.");
  }
  if(j.operador){ sessao.operador = j.operador; mostrarOperador(j.operador); }
  return j;
}
async function apiListar(){
  return (await api("listar")).cadastros || [];
}
async function apiCadastrar(dados){
  return api("cadastrar", { dados });
}

/* ---------- sessão do operador ---------- */
let sessao = { usuario:"", senha:"", operador:"" };
let cadastros = [];

function mostrarOperador(nome){
  const el = $("#opNome");
  el.textContent = nome;
  el.dataset.ini = String(nome || "?").trim().charAt(0);
}
function entrarNoApp(){
  mostrarOperador(sessao.operador);
  $("#opBox").hidden = false;
  $("#telaEntrada").hidden = true;
  $("#telaApp").hidden = false;
  trocarAba("novo");
  $("#f_empresa").focus();
}

$("#formEntrada").addEventListener("submit", async ev => {
  ev.preventDefault();
  const usuario = $("#inOperador").value.trim().replace(/\s+/g," ");
  const senha = $("#inCodigo").value.trim();
  const erro = $("#erroEntrada");
  if(!apiPronta()) return mostrarErro(erro, "O site ainda não foi ligado à planilha (falta a URL do App da Web no index.html).");
  if(!usuario) return mostrarErro(erro, "Digite seu usuário.");
  if(!senha) return mostrarErro(erro, "Digite sua senha.");
  mostrarErro(erro, "");
  const btn = $("#btnEntrar"); btn.disabled = true; btn.textContent = "Entrando…";
  sessao = { usuario, senha, operador:usuario };
  try{
    cadastros = await apiListar();  // também confere usuário e senha
    store.set("cad_usuario", usuario); store.set("cad_senha", senha);
    renderLista();
    entrarNoApp();
  }catch(e){
    mostrarErro(erro, e.message === "Failed to fetch" ? "Sem conexão com a planilha. Confira a internet e a URL do App da Web." : e.message);
  }finally{
    btn.disabled = false; btn.textContent = "Entrar";
  }
});

function sair(msg){
  store.del("cad_senha");
  sessao = { usuario:"", senha:"", operador:"" }; cadastros = [];
  $("#opBox").hidden = true; $("#telaApp").hidden = true; $("#telaEntrada").hidden = false;
  $("#inCodigo").value = "";
  mostrarErro($("#erroEntrada"), msg || "");
  $("#inCodigo").focus();
}
$("#btnSair").addEventListener("click", () => sair());

/* ---------- abas ---------- */
function trocarAba(nome){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.aba === nome));
  $("#abaNovo").hidden = nome !== "novo";
  $("#abaLista").hidden = nome !== "lista";
  if(nome === "lista") carregarLista();
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => trocarAba(b.dataset.aba)));

/* ---------- prévia do ID (mesma regra do script) ---------- */
function previaId(){
  const chave = limpar($("#f_empresa").value).replace(/[^a-z0-9]/g, "");
  const partes = limpar($("#f_pessoa").value).replace(/[^a-z ]/g, "").trim().split(/\s+/).filter(Boolean);
  if(!chave || !partes.length){ $("#prevId").textContent = "—"; return; }
  let sobrenome = "";
  for(let k = 1; k < partes.length; k++){ if(partes[k].length > 3){ sobrenome = partes[k]; break; } }
  $("#prevId").textContent = partes[0] + sobrenome.charAt(0) + chave + "####";
}
$("#f_empresa").addEventListener("input", previaId);
$("#f_pessoa").addEventListener("input", previaId);

/* ---------- CPF ---------- */
function cpfValido(c){
  if(!/^\d{11}$/.test(c) || /^(\d)\1{10}$/.test(c)) return false;
  for(let t = 9; t < 11; t++){
    let s = 0; for(let i = 0; i < t; i++) s += +c[i] * (t + 1 - i);
    if(((s * 10) % 11) % 10 !== +c[t]) return false;
  }
  return true;
}
$("#f_cpf").addEventListener("input", () => {
  const c = $("#f_cpf").value.replace(/\D/g, ""), h = $("#hintCpf");
  if(!c){ h.textContent = ""; h.className = "hint"; return; }
  if(c.length < 11){ h.textContent = c.length + " de 11 dígitos"; h.className = "hint"; return; }
  const ok = cpfValido(c);
  h.textContent = ok ? "CPF válido" : "CPF parece inválido (confira os números)";
  h.className = "hint " + (ok ? "ok" : "err");
});

/* ---------- CEP: mostra o endereço para conferir ---------- */
let cepAtual = "";
$("#f_cep").addEventListener("input", async () => {
  const c = $("#f_cep").value.replace(/\D/g, ""), h = $("#hintCep");
  if(c.length !== 8){ cepAtual = ""; h.textContent = c ? c.length + " de 8 dígitos" : ""; h.className = "hint"; return; }
  if(c === cepAtual) return;
  cepAtual = c; h.textContent = "Buscando endereço…"; h.className = "hint";
  try{
    const r = await fetch("https://brasilapi.com.br/api/cep/v1/" + c);
    if(c !== cepAtual) return;
    if(!r.ok) throw 0;
    const d = await r.json();
    h.textContent = [d.street, d.neighborhood, d.city && (d.city + " - " + d.state)].filter(Boolean).join(" · ");
    h.className = "hint ok";
  }catch(e){
    if(c !== cepAtual) return;
    h.textContent = "CEP não encontrado"; h.className = "hint err";
  }
});

/* ---------- enviar cadastro ---------- */
const CAMPOS = ["empresa","pessoa","imei","cpf","banco","agencia","conta","pix","cep","numero","valor"];

$("#formCadastro").addEventListener("submit", async ev => {
  ev.preventDefault();
  const erro = $("#erroCadastro");
  const dados = {};
  CAMPOS.forEach(c => dados[c] = $("#f_" + c).value.trim());
  dados.cpf = dados.cpf.replace(/\D/g, "");
  dados.cep = dados.cep.replace(/\D/g, "");

  if(!dados.empresa) return mostrarErro(erro, "Preencha a empresa.");
  if(!dados.pessoa) return mostrarErro(erro, "Preencha o nome do usuário.");
  mostrarErro(erro, "");

  const btn = $("#btnCadastrar"); btn.disabled = true; btn.textContent = "Cadastrando…";
  try{
    const res = await apiCadastrar(dados);
    $("#resPessoa").textContent = dados.pessoa + " · " + dados.empresa;
    $("#resPix").textContent = dados.pix || "—";
    $("#resEmail").textContent = res.email;
    $("#resSenha").textContent = res.senha;
    $("#resultado").hidden = false;
    $("#formCadastro").hidden = true;
    window.scrollTo({ top:0, behavior:"smooth" });
    carregarLista(true);
  }catch(e){
    mostrarErro(erro, e.message === "Failed to fetch" ? "Sem conexão com a planilha. Tente de novo." : e.message);
  }finally{
    btn.disabled = false; btn.textContent = "Cadastrar";
  }
});

document.querySelectorAll("[data-copiar]").forEach(b =>
  b.addEventListener("click", () => copiar($("#" + b.dataset.copiar).textContent)));

$("#btnOutro").addEventListener("click", () => {
  // mantém a empresa (normalmente se cadastra várias pessoas da mesma empresa)
  CAMPOS.filter(c => c !== "empresa").forEach(c => $("#f_" + c).value = "");
  ["#hintCpf","#hintCep"].forEach(s => { $(s).textContent = ""; $(s).className = "hint"; });
  cepAtual = "";
  previaId();
  $("#resultado").hidden = true;
  $("#formCadastro").hidden = false;
  $("#f_pessoa").focus();
});
$("#btnVerLista").addEventListener("click", () => trocarAba("lista"));

/* ---------- meus cadastros ---------- */
let carregando = false;
async function carregarLista(silencioso){
  if(carregando) return;
  carregando = true;
  if(!silencioso) $("#statusLista").textContent = "Carregando…";
  try{
    cadastros = await apiListar();
    renderLista();
  }catch(e){
    $("#statusLista").textContent = "Erro: " + (e.message === "Failed to fetch" ? "sem conexão com a planilha." : e.message);
  }finally{
    carregando = false;
  }
}

function renderLista(){
  $("#contador").textContent = cadastros.length;
  const q = limpar($("#busca").value.trim());
  const filtrados = !q ? cadastros : cadastros.filter(c =>
    limpar([c.pessoa, c.id, c.email, c.empresa, c.cpf, c.imei, c.pix].join(" ")).includes(q));

  $("#statusLista").textContent = cadastros.length
    ? (q ? `${filtrados.length} de ${cadastros.length} cadastros` : `${cadastros.length} cadastro${cadastros.length > 1 ? "s" : ""} feitos por ${sessao.operador}`)
    : "";

  if(!cadastros.length){
    $("#lista").innerHTML = `<div class="empty">Você ainda não fez nenhum cadastro.</div>`;
    return;
  }
  if(!filtrados.length){
    $("#lista").innerHTML = `<div class="empty">Nada encontrado para essa busca.</div>`;
    return;
  }

  const campo = (rot, val) => `<div><small>${rot}</small>${esc(val) || "—"}</div>`;
  $("#lista").innerHTML = filtrados.map(c => `
    <details class="item">
      <summary>
        <div class="who">
          <b>${esc(c.pessoa)}</b>
          <span>${esc(c.email)}</span>
          <div class="mini">
            <em><small>Senha</small>${esc(c.senha) || "—"}</em>
            <em><small>SR / IMEI</small>${esc(c.imei) || "—"}</em>
            <em><small>Pix</small>${esc(c.pix) || "—"}</em>
          </div>
        </div>
        <div class="when">${esc(c.empresa)}<br>${esc(c.data)}</div>
      </summary>
      <div class="det">
        ${campo("E-mail", c.email)}
        ${campo("Senha", c.senha)}
        ${campo("Empresa", c.empresa)}
        ${campo("IMEI / SR", c.imei)}
        ${campo("CPF", c.cpf)}
        ${campo("Banco", c.banco)}
        ${campo("Agência", c.agencia)}
        ${campo("Conta", c.conta)}
        ${campo("Pix", c.pix)}
        ${campo("CEP", c.cep)}
        ${campo("Rua", c.rua)}
        ${campo("Número", c.numero)}
        ${campo("Bairro", c.bairro)}
        ${campo("Cidade", c.cidade)}
        ${campo("$", c.valor)}
        ${campo("Data / hora", (c.data || "") + " " + (c.hora || ""))}
        <div class="acts">
          <button class="copy" data-txt="${esc(c.email)}">Copiar e-mail</button>
          <button class="copy" data-txt="${esc(c.senha)}">Copiar senha</button>
          <button class="copy" data-txt="${esc(c.id)}">Copiar ID</button>
        </div>
      </div>
    </details>`).join("");
}
$("#busca").addEventListener("input", renderLista);
$("#btnAtualizar").addEventListener("click", () => carregarLista());
$("#lista").addEventListener("click", ev => {
  const b = ev.target.closest("[data-txt]");
  if(b) copiar(b.dataset.txt);
});

/* ---------- início ---------- */
(function iniciar(){
  const u = store.get("cad_usuario"), s = store.get("cad_senha");
  if(u && s && apiPronta()){
    sessao = { usuario:u, senha:s, operador:u };
    entrarNoApp();
    carregarLista(true);
  }else{
    if(u){ $("#inOperador").value = u; $("#inCodigo").focus(); }
    else $("#inOperador").focus();
  }
})();
</script>
</body>
